[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-speech-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.109", "uvicorn>=0.27", "python-multipart>=0.0.6", "soundfile>=0.12", "numpy>=1.24"]

[project.optional-dependencies]
stt = ["funasr>=1.0", "faster-whisper>=1.2", "sherpa-onnx>=1.13"]
test = ["httpx>=0.27"]

[project.scripts]
hermes-speech-service = "hermes_speech_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

